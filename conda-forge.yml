build_platform:
  linux_aarch64: linux_64
  osx_arm64: osx_64
conda_forge_output_validation: true
github:
  branch_name: main
  tooling_branch_name: main
conda_build:
  pkg_format: '2'
test: native_and_emulated
linter:
  skip:
    # Upstream binaries need macOS 12; constrain __osx directly instead of
    # raising c_stdlib_version, since nothing is compiled.
    - lint_stdlib
